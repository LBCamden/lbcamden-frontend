params:
  - name: titleHeadingLevel
    type: string
    required: true
    description: Level of the heading (H2 or H3)
  - name: titleText
    type: string
    required: true
    description: Text of the heading
  - name: excludeHeadings
    type: array
    required: false
    description: List of heading levels to exclude from the items list (e.g., ["H2", "H3"])
  - name: items
    type: array
    required: true
    description: List of items to display on the page
    params:
      - name: title
        type: string
        required: true
        description: Text of the item to display on the page
      - name: anchor
        type: string
        required: true
        description: link for the item

examples:
  - name: default
    params:
      titleHeadingLevel: H2
      titleText: "On This Page"
      items:
        - title: "Introduction"
          anchor: "#introduction"
          headingLevel: H2
          include: true
        - title: "Features"
          anchor: "#features"
          headingLevel: H2
          include: false
        - title: "Contact Information"
          anchor: "#contact-information"
          headingLevel: H2
          include: true

  - name: Example with H3 heading
    params:
      titleHeadingLevel: H3
      titleText: "Contents"
      items:
        - title: "Overview"
          anchor: "#overview"
          headingLevel: H3
          include: false
        - title: "Details"
          anchor: "#details"
          headingLevel: H3
          include: true
        - title: "Summary"
          anchor: "#summary"
          include: true
          headingLevel: H2